Lesson: Email
Activity: Email Setup & Message Header Analysis
Before this activity, I mostly thought of email as a simple tool—type, send, done. But diving into how email actually works changed that perspective. I learned about the roles of SMTP, POP3, and IMAP, and how message headers store valuable information like where a message really came from. What surprised me most was how easily you can trace an email’s path across servers if you know what you’re looking for.
How I’ll apply it: This kind of knowledge feels super useful in both academic and professional settings. Whether I’m troubleshooting why an important email didn’t go through or analyzing spam or phishing attempts, I now feel a lot more confident navigating email beyond just the inbox.

Lesson: Social Media
Activity: Platform Comparison & Honeycomb Framework
This lesson really made me reflect on how I use social media—not just for fun, but for building connections and sharing ideas. Using the Honeycomb model to break down platforms like Instagram, LinkedIn, and Reddit helped me understand why each one feels different. For instance, LinkedIn is all about identity and reputation, while Instagram is more about presence and sharing.
How I’ll apply it: I realized I need to be more intentional with how I present myself online. As I prepare for internships and future jobs, platforms like LinkedIn aren’t just optional—they’re essential tools for networking and professional growth. I also see how this knowledge could help if I ever work in marketing or digital communications.  

Lesson: Communications
Activity: VoIP/Messaging, File Sharing, and Remote Desktop
I’ve used Zoom and Google Drive plenty of times, but this activity introduced me to tools like FTP, SFTP, and remote desktop access, which felt way more technical. I learned how these tools are used to securely transfer files, troubleshoot tech issues remotely, and communicate through services like Skype and WhatsApp. It also opened my eyes to the ethical and legal concerns around peer-to-peer sharing.
How I’ll apply it: Whether I’m working on group projects, freelancing, or collaborating remotely in a future job, these tools will definitely come in handy. I also feel more aware of the importance of respecting copyright laws and using secure file transfer methods.
